<!--
  Adaptive-icon foreground. Launchers mask to various shapes and only the
  centre ~61% is guaranteed visible, so the mark is scaled into that safe zone.
  The gradient lives in icon-background.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1016"/>
      <stop offset="1" stop-color="#0B0B10"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A66"/>
      <stop offset="1" stop-color="#F4573F"/>
    </linearGradient>
  </defs>

  <g transform="translate(512 512) scale(0.72) translate(-512 -490)">
    <g stroke="#FFFFFF" stroke-width="30" stroke-linecap="round">
      <line x1="512" y1="318" x2="410" y2="196"/>
      <line x1="512" y1="318" x2="614" y2="196"/>
    </g>
    <circle cx="410" cy="196" r="28" fill="#FFFFFF"/>
    <circle cx="614" cy="196" r="28" fill="#FFFFFF"/>

    <rect x="196" y="318" width="632" height="436" rx="110" fill="#FFFFFF"/>
    <rect x="244" y="366" width="536" height="340" rx="70" fill="url(#screen)"/>

    <g fill="none" stroke="url(#signal)" stroke-width="36" stroke-linecap="round">
      <path d="M448.4 546.4 A90 90 0 0 1 575.6 546.4"/>
      <path d="M391.8 489.8 A170 170 0 0 1 632.2 489.8"/>
    </g>
    <circle cx="512" cy="616" r="34" fill="#FF7A66"/>

    <rect x="412" y="776" width="200" height="36" rx="18" fill="#FFFFFF"/>
  </g>
</svg>
